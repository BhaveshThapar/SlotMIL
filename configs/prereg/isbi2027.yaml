# Pre-registration -- ISBI 2027 submission
#
# This file is the machine-readable half of PREREGISTRATION.md. It is frozen by
# scripts/prereg_freeze.py, which writes its sha256 into that document; the
# analysis code reads parameters ONLY from here and raises PreregViolation on
# anything undeclared. Editing this file after the freeze changes its hash, which
# breaks the chain and is exactly the signal we want -- amendments go in
# AMENDMENTS.md and are dated.
#
# Do not add a timestamp field. Outputs are stamped with this config's hash, and
# a timestamp would make otherwise-identical runs differ byte-for-byte, which
# defeats the reproduction check.

version: isbi2027.v1
title: >-
  Position priors dominate instance-level localisation metrics for
  weakly-supervised MIL in volumetric CT
target: ISBI 2027, deadline 2026-10-26
frozen_on: '2026-08-12'

scope: >-
  Covers the CONFIRMATORY analyses only: the untrained-init reference floor
  (WP3), the architecture sweep (WP5), the condition/dataset sweep (WP6), and
  every estimand computed on them. Everything computed before this file was
  frozen -- the null battery, the static-template analysis, the crosstab, the
  axis gate -- is EXPLORATORY by construction and must be labelled that way in
  the paper. Exploratory results set the hypothesis thresholds below; that is
  legitimate and is stated openly rather than hidden.

# ---------------------------------------------------------------- data
datasets:
  lidc:
    cache: data/lidc/features_dinov2_vitb14.h5
    grid: [16, 16]
    patches_per_slice: 256
    role: primary
    splits:
      discovery:
        path: data/lidc/splits.json
        seed: 0
        recorded_hash: 9f468f8bd8a59228
        role: exploratory
        note: >-
          The split every published number so far was computed on. The protocol
          was developed against it, so it cannot carry confirmatory claims.
      confirmatory:
        path: data/lidc/splits_confirmatory.json
        seed: 2027
        recorded_hash: efcac704eb540cc8   # filled by prereg_freeze.py --update-splits
        role: confirmatory
        note: >-
          Re-splitting is clean here because the DINOv2 cache is frozen and
          unsupervised, so no label information crosses the split boundary.
      # Added by amendment 2026-08-15. Same seed and the same re-splitting
      # argument as `confirmatory` above; both are relabellings of the identical
      # frozen cache, so drawing them costs one training sweep each and nothing
      # else. Their power limits are stated in AMENDMENTS.md rather than
      # discovered at analysis time.
      malignancy_confirmatory:
        path: data/lidc/splits_malignancy_confirmatory.json
        seed: 2027
        recorded_hash: 8cb89c9a0b70b759
        role: confirmatory
        n_series: 734
        note: >-
          512/111/111 over 726 patients, 50.4% positive. The supervised patch
          probe ceils at 0.6516 here against nodule presence's 0.9102, so this
          condition tests the label rather than the method; it is a consistency
          check and does not carry the hypothesis family.
      balanced_confirmatory:
        path: data/lidc/splits_balanced_confirmatory.json
        seed: 2027
        recorded_hash: 554390c2a05a663b
        role: confirmatory
        n_series: 262
        note: >-
          184/40/38 over 262 patients, exactly 50/50. THIRTY-EIGHT test bags: a
          10000-rep patient-clustered bootstrap over 38 clusters gives intervals
          wide enough that most outcomes land indistinguishable by default. That
          is a property of the design and is not to be reported as a finding.

  mosmed:
    cache: data/mosmed/features_dinov2_vitb14.h5
    grid: [16, 16]
    patches_per_slice: 256
    role: secondary
    splits:
      existing:
        path: data/mosmed/splits.json
        seed: 0
        recorded_hash: d8fbffefc2a7134c
        role: confirmatory_with_caveat
        note: >-
          NOT re-split. Only 50 of 1110 MosMed scans carry masks and all are
          CT-1; a fresh split would leave too few annotated scans in test to
          estimate anything. MosMed therefore supports the stereotypy contrast
          (H9) and nothing else, and the paper says so.

conditions:
  - name: nodule_present
    dataset: lidc
    labels: null            # baked into the HDF5 attrs
    positive_rate: 0.869
    split: confirmatory
    carries_hypothesis_family: true
  - name: malignancy
    dataset: lidc
    labels: data/lidc/labels_malignancy.json
    positive_rate: 0.504
    split: malignancy_confirmatory
    carries_hypothesis_family: false
  # Added by amendment 2026-08-15. runs/lidc_balanced/ has held five seeds of
  # discovery results since commit 589dd63 while this block did not name the
  # condition at all -- a declared experiment may be dropped, but it may not be
  # missing.
  - name: balanced_presence
    dataset: lidc
    labels: data/lidc/labels_balanced_presence.json
    positive_rate: 0.500
    split: balanced_confirmatory
    carries_hypothesis_family: false
  - name: mosmed_severity
    dataset: mosmed
    labels: data/mosmed/splits.json
    num_classes: 4
    split: existing
    carries_hypothesis_family: false

# Exactly one condition carries the pre-registered hypothesis family and the Holm
# correction. Correcting across all three would spend the power of the condition that
# carries the claim in order to protect two that cannot carry it (38 test bags;
# a 0.65 supervised ceiling), and picking which condition leads after seeing three
# verdict tables is the same best-of-k error refused for the template denominator.
# Ruled 2026-08-15, before any confirmatory number existed.
hypothesis_family_condition: nodule_present

# ---------------------------------------------------------------- arms
#
# status: implemented | planned. An arm may be unbuilt at freeze time -- that is
# the point of pre-registering -- but it may never go missing silently, so
# tests/test_prereg.py asserts every `implemented` arm is constructible and every
# `planned` arm is declared here.
#
# blind: model arms are shown to the analysis layer as opaque codes. Reference
# baselines are never blinded because the estimands need to know which one is the
# template.
#
# spec strings are parsed by scripts/train_cached.py:34 parse_arm, which coerces
# every override value to float -- overrides must be numeric `k=v`.

# scoring_class, added by amendment 2026-08-15, decides which hypothesis arm sets an arm
# belongs to. It generalises the prose `trained_arm_definition` H2 already carried, so that the
# next hypothesis with the same hole does not need a second prose exclusion beside it.
#
#   learned_attention          the attention path contains fitted parameters
#   uniform_attention          attention is exactly 1/n, so every axis AUC is 0.5 on ties
#   fixed_geometric_attention  attention is a function of slice index alone
#
# Only learned_attention arms enter H1/H2/H4/H5/H6. The other two are reported in every table
# with their construction-fixed values; see AMENDMENTS.md for why the exclusion cannot move
# H1's falsification bar.
arms:
  - {name: mean,            spec: 'mean',            status: implemented, blind: true,
     scoring_class: uniform_attention}
  - {name: abmil,           spec: 'abmil',           status: implemented, blind: true,
     scoring_class: learned_attention}
  - {name: gated_abmil,     spec: 'gated_abmil',     status: implemented, blind: true,
     scoring_class: learned_attention}
  - {name: mh_abmil,        spec: 'mh_abmil',        status: implemented, blind: true,
     scoring_class: learned_attention}
  - {name: slot_div0.5,     spec: 'slot:div=0.5',    status: implemented, blind: true,
     scoring_class: learned_attention}
  - name: centre_gaussian
    spec: 'centre_gaussian'
    status: implemented
    blind: false
    scoring_class: fixed_geometric_attention
    note: >-
      Harvey et al. arXiv:2605.27306 -- a_ij proportional to
      NormPDF(j | S_i/2, 1) over slice index. Content-free reference, so its
      identity must stay visible.
    # Added by amendment 2026-08-15, on implementation. Harvey's printed sigma=1
    # over the RAW slice index is not computable on volumetric CT: the tail logit
    # is -3612 nats at S=171 and -61075 at S=700, against -103.3 for float32's
    # smallest subnormal and -744.4 for float64's. The logits survive, but this
    # arm returns normalised attention and the softmax collapses 142 of 171
    # slices to exactly 0.0 -- a tie block over 83% of the bag, which
    # roc_auc_score credits at 0.5. See AMENDMENTS.md.
    support: normalised_slice_index      # z = linspace(-1, 1, S_i)
    sigma_z: 0.25
    mu_convention: '(S-1)/2'
    sigma_selection_rule: >-
      sigma cannot move any pre-registered number: NormPDF(.|mu,sigma) is
      strictly monotone in -|j-mu| for every sigma > 0 and every estimand here is
      rank-based (measured: slice AUC identical to 12 decimal places across
      sigma_z in [0.25, 1.0]). It is therefore fixed on representability alone --
      0.25 is the midpoint of the band where fp32 keeps the tie structure intact
      and fp16 still resolves every distinct value, i.e. the peakiest, most
      Harvey-like sigma that survives AMP. Below ~0.227 the fp32 tails lose
      precision and the AUC moves in the third decimal.
  - name: normal_guidance
    spec: 'normal_guidance:lam=0.1'
    status: implemented
    blind: true
    scoring_class: learned_attention
    note: >-
      KL to a moment-matched Normal over slice index, recomputed under
      stop-gradient each step. Carries H6.
    # Added by amendment 2026-08-15, on implementation. The prereg named neither
    # the base arm, nor the KL direction, nor what the Normal is matched to, nor
    # a variance floor. All four are ruled here. See AMENDMENTS.md.
    base_arm: gated_abmil
    kl_direction: 'KL(attention_slice_marginal || moment_matched_normal)'
    moment_source: own_marginal_detached
    var_floor_slices2: 1.0
    moment_scope: per_bag_per_head
    base_arm_rationale: >-
      gated_abmil has exactly one attention distribution over instances, so the
      slice marginal needs no extra convention; carries no other regulariser, so
      H6's delta is attributable to the KL alone; and is the study's strongest
      classifier, so a localisation gain cannot be dismissed as rescuing a weak
      arm. Implemented as a registry alias rather than a subclass, so NG and its
      base are the same class and lam=0 reproduces the base bit-for-bit.
    var_floor_rationale: >-
      Not optional. Moment-matched to its own marginal, a single-slice attention
      is a global minimum at exactly 0 -- a Dirac is the sigma->0 Normal -- so an
      unfloored term rewards collapsing attention onto one slice and would report
      that collapse as localisation. Floored at 1 slice^2 (Harvey's sigma, in the
      one place a raw-slice sigma is both meaningful and representable) a delta
      pays 0.9189 nats while a true Gaussian pays 0.
  - name: clam_sb
    spec: 'clam_sb'
    status: implemented
    blind: true
    scoring_class: learned_attention
    base_arm: gated_abmil
    topk_b: 8
    bag_weight: 0.7
    instance_loss: cross_entropy
    subtyping: false
    attn_norm_axis: instance
    k_tokens: 1
    rationale: >-
      Implemented as a subclass of gated_abmil, so the attention path is
      bit-identical and the whole difference between the two arms is the
      clustering objective -- the same construction that makes the H6 comparison
      attributable for normal_guidance. hidden therefore stays at the project's
      128 rather than CLAM's 256.
    topk_rationale: >-
      B stays at CLAM's printed 8 rather than a fraction of the bag. LIDC bags
      reach 43.8k instances against a WSI's few thousand, so a proportional k
      would make this term's effective weight scale with scan depth -- roughly
      12x across the cohort -- and the branch exists to sharpen attention's
      extremes, not to label the bag. On a bag too short for 2k disjoint
      instances, k falls to n_valid // 2 for that bag so the top and bottom sets
      cannot overlap and train the classifier on contradictory labels for the
      same instance.
    instance_loss_rationale: >-
      Cross-entropy on the pseudo-labels, not the reference implementation's
      smooth top-1 SVM. The SVM surrogate arrives as a third-party package for a
      margin no pre-registered estimand reads -- the branch shapes attention and
      attention is scored by rank -- so CE is the standard surrogate for the same
      2k pseudo-labels and keeps the dependency set auditable.
  - name: dsmil
    spec: 'dsmil'
    status: implemented
    blind: true
    scoring_class: learned_attention
    q_hidden: 128
    dropout_v: 0.0
    bag_weight: 0.5
    attn_norm_axis: instance
    k_tokens: num_classes
    rationale: >-
      K = num_classes, not 1: DSMIL selects a critical instance per class and
      builds one bag embedding per class, so collapsing to a single token would
      be a different method. The frozen-slot protocol already handles K > 1
      (Hungarian on validation; argmax of the lesion column for F=2), so the
      published shape costs nothing here.
    departures: >-
      Two, both stated rather than absorbed. The bag score comes from the
      project's shared gated readout rather than DSMIL's per-class Conv1d, and
      the instance stream is supervised through the loss at weight 0.5 rather
      than being averaged into the reported logits. Both exist so that the
      classification head is identical across every arm and a difference is
      attributable to pooling; averaging the streams would give DSMIL a
      classifier no other arm has and confound the H1/H2 comparisons. The
      fidelity cost is real and is reported as one.
  - name: transmil
    spec: 'transmil'
    status: planned
    blind: true
    scoring_class: learned_attention
    drop_rule: >-
      LIDC bags are ~43.8k instances, far beyond the WSI bags TransMIL was
      designed for. If it is not training by 2026-09-22, cut it and report the
      arm count achieved. Do not slip the deadline for this arm.

# ---------------------------------------------------------------- references
reference_baselines:
  - {name: chance,                 kind: analytic,             impl: null}
  - {name: centre_prior,           kind: model_free,           impl: 'null_battery.centre_prior_auc'}
  - name: fitted_template
    kind: content_free_fitted
    impl: 'null_static_template.global_template'
    fit_split: val
    note: >-
      A 256-number in-plane map fit on validation that never reads a test image.
      Tighter than Arun et al.'s unfit AVG mask and than Harvey's fixed sigma=1
      Gaussian, so it is the right denominator for prior-normalised skill.
  - {name: cross_patient,          kind: permutation, impl: 'null_battery.shuffle_masks_across_bags'}
  - {name: roll_permutation,       kind: permutation, impl: 'null_battery.roll_masks'}
  - {name: entropy_matched_random, kind: random,      impl: 'null_battery.random_attn'}
  - name: untrained_fleet
    kind: untrained
    impl: 'null_collect_attn (no --ckpt)'
    n_inits: 30
    init_seed_base: 20270000
    note: >-
      Two inits spanning 0.6433-0.7858 cannot support a stated floor. Report the
      floor as a distribution: median and 5-95th percentile.
  - {name: supervised_patch_probe, kind: ceiling, impl: 'probe_ceiling'}

# ---------------------------------------------------------------- protocol
protocol:
  dtype: float32          # fp16 attention caching cost seed2 0.034 AUC
  seeds: [0, 1, 2, 3, 4]
  training:
    # Added by amendment 2026-08-15. Undeclared until now -- it was a
    # scripts/train_cached.py argparse default and nothing more. It is declared
    # because normal_guidance made it material: under subsampling, bag position k
    # is true slice sel[k], so the KL's 1-slice^2 variance floor would be applied
    # in subsampled units, a random per-bag multiple of the anatomical scale
    # (~213x in variance for a 700-slice volume cut to 48). collate_bags
    # therefore carries the true slice_index through to the loss.
    max_slices: 48
    max_slices_applies_to: train_only   # evaluation always uses the full bag
    note: >-
      The KL is invariant to affine rescaling of the slice coordinate, because
      the target's moments are fit to the marginal. slice_index therefore matters
      through exactly one channel -- the variance floor -- which is why it is
      plumbed to the loss and not to the model.
  instance_label:
    rule: 'patch_lesion_fraction > 0'
    sensitivity_thresholds: [0.0, 0.005, 0.01, 0.02]
    note: >-
      The cached mask is a coverage fraction topping out near 0.05 -- a nodule
      never fills more than ~5% of a 22mm patch -- so `> 0` means "this patch
      contains at least one lesion voxel". Generous by default, and part of why
      position dominates. The sweep is a declared secondary analysis.
  slot_selection:
    method: hungarian_on_complementary_findings
    fit_split: val
    frozen: true
    note: >-
      For F=2 complementary columns this is algebraically argmax of the lesion
      column. The framing must not overstate the naming step.
  bag_inclusion:
    drop_all_positive: true
    drop_all_negative: true
    require_multiple_of_patches_per_slice: true
  lung_mask:
    # Added by amendment 2026-08-14. Selected on 30 series sampled with seed 2027
    # with the confirmatory test split excluded, so the choice never saw data
    # carrying H8. See AMENDMENTS.md.
    method: fill
    lung_thresh: 0.0
    patch_rule: 'a patch is in-lung when it contains any lung at all'
    selection_rule: >-
      Among methods reaching containment 1.0, the tightest wins -- a looser mask
      restricts less and therefore proves less. All four methods reach 1.0 at
      threshold 0.0, so tightness decides: air 0.24280, fill 0.24306,
      fill_close 0.24341, fill_hull 0.26893.
    deviation_from_selection_rule: >-
      The rule as stated picks `air` (0.00026 tighter than `fill`). Overridden:
      `air` is the deliberately unrepaired negative control, so it inherits
      lung_mask_3d's 3x3x3 closing artefact and returns empty first and last
      slices. The 26 lesion-bearing series sampled happened to carry no lesion
      patch on an end slice; across 999 that would eventually delete positives.
      `fill` is 0.1% looser and structurally safe, so it wins on a tiebreak the
      mechanical rule cannot see.

statistics:
  bootstrap:
    kind: cluster
    cluster_by: patient
    reps: 10000
    rng_seed: 0
    ci: percentile_95
  paired_test: delong
  multiplicity: holm
  alpha: 0.05

  # Added by amendment 2026-08-15. `multiplicity: holm` declared a correction over
  # a family this file never defined, and eight of the ten hypotheses emit no
  # p-value at all -- their falsifiers compare a point estimate to a threshold.
  # Two rulings, and the order matters.
  verdict_basis: point_estimate
  verdict_basis_rationale: >-
    Hypothesis verdicts are scored exactly as their falsifiers are written, on
    point estimates, with the patient-clustered 95% CI reported beside every one
    and never changing a verdict. Rewriting point-estimate falsifiers as interval
    rules now would loosen or tighten every one of them in a direction chosen with
    the discovery numbers already in hand. H9 and H10 state CI-based falsifiers in
    their own text and keep them; those two are scored on the interval because
    that is what they were written to be.

  holm_family:
    # Holm therefore corrects a NAMED family of paired DeLong comparisons, not the
    # hypothesis list. Each member is a paired test on the flat instance axis
    # between one learned_attention arm and one content-free reference, over the
    # condition named by hypothesis_family_condition. classification.delong_test
    # and classification.holm_reject are implemented and unit-tested and have had
    # no caller outside tests/; this is what they are for.
    scope: 'arms in H1.arm_set x references below, on the condition carrying the family'
    references: [fitted_template, centre_prior, cross_patient]
    axis: flat_instance_auc
    alpha: 0.05
    note: >-
      Enumerated rather than computed at analysis time so that the family size --
      which sets every adjusted p-value -- cannot be changed by deciding later to
      report one more comparison.

# ---------------------------------------------------------------- estimands
estimands:
  primary:
    - name: prior_normalised_skill
      formula: '(auc - auc_fitted_template) / (1 - auc_fitted_template)'
      prior_art: >-
        Structurally information gain over a baseline model (Kummerer, Wallis &
        Bethge, PNAS 2015). Imported, not invented; we claim the construction.
    - name: patient_specific_skill
      formula: 'auc_real - auc_cross_patient'
      prior_art: >-
        Structurally shuffled AUC (Borji et al. ICCV 2013; Bylinskii et al.
        TPAMI 2019). Imported, not invented.
  secondary:
    - {name: flat_instance_auc,   impl: 'null_battery.score'}
    - {name: slice_auc,           impl: 'axis_gate.per_bag_axes'}
    - {name: within_slice_auc,    impl: 'axis_gate.per_bag_axes'}
    - name: stratified_auc
      impl: 'diagnose_confound.strat_auc'
      strata: [normalised_slice, radial_bin]
      n_radial_bins: 6
    - {name: ap_lift_over_prevalence, impl: 'localization.evaluate_localization'}
    - name: in_lung_stratified_auc
      impl: 'estimands.stratified_auc restricted to protocol.lung_mask'
      depends_on: lung_mask
  decomposition:
    kind: nested_reference_chain
    chain: [chance, fitted_template, cross_patient, full]
    note: >-
      Report differences between adjacent links, not a bare three-term sum. AUC
      is not naturally additive and a reviewer will attack an additive claim;
      the nested-chain form is defensible and mirrors Kummerer et al.

# ---------------------------------------------------------------- hypotheses
#
# Every hypothesis carries a numeric falsifier. Thresholds are set from the
# discovery set, which is legitimate and disclosed. A hypothesis with no way to
# fail is ceremony, not pre-registration.

hypotheses:
  - id: H1
    role: primary
    statement: >-
      For every arm, |flat instance AUC - within-slice instance AUC| < 0.02:
      the reported 3D metric is an in-plane metric wearing 3D clothing.
    threshold: 0.02
    falsifier: >-
      Fails for a majority of arms -> the paper's lead claim is withdrawn and
      the in-plane framing is abandoned.
    # Arm set and controls added by amendment 2026-08-15, before the confirmatory
    # sweep was submitted. See AMENDMENTS.md for the full argument, including the
    # arithmetic showing the exclusion does not move this hypothesis's bar:
    # over 9 arms a majority is 5, and centre_gaussian contributes one guaranteed
    # failure, so falsification needs 4 of the other 7; over the 7-arm set a
    # majority is 4 -- the same four.
    arm_set: learned_attention
    positive_controls:
      # References that carry axial information and therefore MUST exceed the
      # threshold. If any comes in under 0.02 the harness is broken and the H1
      # verdict is void rather than supported -- a test that cannot fail is
      # ceremony. Discovery values, for reference: 0.0978 / 0.0259 / 0.0401.
      members: [masks:axial, masks:separable, centre_prior]
      rule: 'every member must exceed threshold; otherwise H1 verdict = void'
    tie_floor_check:
      # mean returns exactly 1/n, so both axes are 0.5 on ties and the gap is
      # identically zero. Any other value means the tie handling changed
      # underneath the estimand.
      arm: mean
      expected_gap: 0.0
  - id: H2
    role: primary
    statement: >-
      The model-free centre prior's slice AUC exceeds every trained arm's slice
      AUC -- attention MIL is worse than geometry on the axial axis.
    falsifier: any trained arm beats the centre prior on the slice axis.
    # Scope ruled by amendment 2026-08-15, BEFORE any H2 number exists.
    # "Every trained arm" means arms whose ATTENTION has learned parameters.
    # centre_gaussian is excluded: nothing in its attention path is fit to
    # anything, and it ranks slices by -|z| exactly as the centre_prior reference
    # does, so it will TIE that reference rather than be beaten by it. A tie is
    # not "exceeds", so without this ruling an arm that IS a centre prior would
    # falsify a hypothesis about centre priors. Ruled now rather than at analysis
    # time precisely so it cannot be a post-hoc call.
    trained_arm_definition: >-
      An arm whose attention path contains learned parameters. Excludes
      centre_gaussian, whose attention is a fixed geometric rule; its bag
      classifier is trained, but its attention -- the thing H2 compares -- is not.
    excluded_arms: [centre_gaussian]
    # Added 2026-08-15. arm_set is the mechanical form of trained_arm_definition
    # above; the prose ruling stands unchanged and the two agree by construction
    # (centre_gaussian is fixed_geometric_attention, mean is uniform_attention).
    # Kept side by side deliberately: the prose records why, the class records
    # how, and a future reader can check they have not drifted apart.
    arm_set: learned_attention
  - id: H3
    role: primary
    statement: >-
      Over >=30 untrained inits the 95th-percentile instance AUC exceeds 0.70,
      i.e. 0.5 is not the floor.
    threshold: 0.70
    falsifier: 95th percentile <= 0.70.
  - id: H4
    role: primary
    statement: >-
      Every arm's patient-specific skill is < 0.15, and the median across arms
      is < 0.10.
    threshold: {per_arm: 0.15, median: 0.10}
    falsifier: any arm >= 0.15, or median >= 0.10.
    arm_set: learned_attention
    # Operationalised by amendment 2026-08-15. The estimand was named
    # (auc_real - auc_cross_patient) but not the axis, the number of
    # derangements, or the RNG -- three people would have computed three
    # different numbers, and H6 reads the same quantity.
    cross_patient:
      axis: flat
      impl: 'nulls.shuffle_masks_across_bags'
      n_derangements: 100
      rng_seed: 0
      aggregate: mean_over_derangements
      pairing: per_bag_against_the_real_score
      interval: 'estimands.cluster_bootstrap, reps and seed from statistics.bootstrap'
  - id: H5
    role: secondary
    statement: >-
      No arm's prior-normalised skill, taken as the mean over that arm's
      float32 seeds, exceeds 0.30.
    threshold: 0.30
    unit: mean_over_seeds
    report_per_seed: true
    arm_set: learned_attention
    falsifier: any arm's mean over seeds exceeds 0.30.
    unit_rationale: >-
      The original statement named a threshold and not a unit, which leaves the
      arm's number free to be a per-seed value or an aggregate -- the same hole
      H2's "every trained arm" had. Ruled as the mean because that is the
      statement's own noun ("no ARM's skill") and because H4 is already per-arm;
      a per-seed-max rule instead takes five draws at the threshold rather than
      one, which is the best-of-k inflation the template family already refuses
      when it declines to promote the strongest reference to denominator.
      report_per_seed is not decoration: a seed above 0.30 appears in the paper
      whether or not it falsifies, because the unit ruling must not become a way
      of not reporting a number.
  - id: H6
    role: primary
    statement: >-
      Normal Guidance raises slice-level AUC over its base arm but raises
      patient-specific skill by less than 0.02.
    threshold: 0.02
    falsifier: >-
      Patient-specific skill rises by >= 0.02 -- prior injection would then be
      adding real information and the critique fails.
    arm_set: learned_attention
    # H6 reads the same estimand as H4 and uses H4's cross_patient block
    # verbatim; declared by reference rather than copied so the two cannot
    # drift apart into two different numbers with one name.
    cross_patient: same_as_H4
    base_arm_comparison:
      arm: 'normal_guidance:lam=0.1'
      base: gated_abmil
      axes: [slice_auc, patient_specific_skill]
  - id: H7
    role: power_gate
    statement: >-
      The supervised patch probe's prior-normalised skill exceeds 0.50 while
      every content-free baseline's is below 0.05.
    threshold: {probe: 0.50, content_free: 0.05}
    falsifier: >-
      The probe fails to separate -> the proposed estimands have no power and
      must not be recommended. This gate blocks the constructive half of the
      paper.
    # Everything below added by amendment 2026-08-15. The statement was not
    # computable as written, in three ways: the probe had no declared
    # denominator (carrying its 0.9102 through the eight stored denominators
    # spans skill 0.4720-0.7224, straddling the 0.50 threshold);
    # probe_ceiling.py returned a bare AUC over a subsampled test set, which is
    # not divisible into a skill; and "every content-free baseline" was an
    # undefined set. See AMENDMENTS.md, including the disclosure that the
    # mask-family figures were known when the set was ruled and centre_prior's
    # was not.
    probe_denominator: own_fitted_inplane_template
    probe_denominator_rationale: >-
      Not a new rule -- the existing fitted_template rule applied to a scorer
      nobody had explicitly handed to it. global_template fits to the SCORER's
      own validation attention, so every arm already carries its own
      denominator; the probe's per-patch scores take the place of attention and
      it carries its own too. Borrowing another arm's would make the verdict
      depend on which arm was borrowed from.
    content_free_set: [chance, roll_permutation, entropy_matched_random, fitted_template]
    content_free_set_rationale: >-
      All four are in the pre-freeze reference_baselines block and none reads a
      label. fitted_template scores exactly 0 against itself by construction and
      is included so the set is never empty. EXCLUDED, with reasons: the
      mask-fitted template family (templates.py) is content-free in this
      document's sense -- it never reads a test image -- but it is fit to
      validation LESION MASKS, so it is not label-free. Requiring a reference
      fitted to lesion labels to score below 0.05, in the same breath as
      requiring a supervised probe to score above 0.50, is not a strict test but
      an inconsistent one. centre_prior is excluded as axially informative by
      construction: the denominator is in-plane and has slice AUC exactly 0.5,
      so skill above zero for centre_prior measures a limit of the denominator,
      which is this paper's own thesis rather than a failure of the instrument.
    reported_beside_the_gate: [masks:separable, masks:inplane, centre_prior]
    reported_beside_the_gate_rule: >-
      Reported in the same table as the gate, whether or not H7 clears, and the
      discussion states that an in-plane denominator under-credits axial
      content-free structure -- so skill against it is an UPPER BOUND for any
      scorer carrying axial structure. This is the cost of the exclusions above
      and it is paid in the paper rather than hidden.
    probe_protocol:
      fit_split: train
      fit_negatives_per_positive: 20
      fit_rng_seed: 0
      score_split: test
      score_coverage: every_patch_of_every_bag
      note: >-
        Subsampling at FIT time is a fitting choice and touches no estimand.
        Subsampling at SCORE time changes the estimand -- the numerator would be
        computed over a different patch population than the denominator -- and is
        forbidden. Emitted in the (attns, masks) shape the dumps use so it flows
        through per_bag_axes and fit_family unchanged.
  - id: H8
    role: two_sided
    statement: In-lung fitted-template AUC exceeds 0.65.
    threshold: 0.65
    falsifier: >-
      None -- reported either way. If restricting to lung removes the prior,
      that becomes the paper's actionable recommendation instead.
  - id: H9
    role: secondary
    statement: >-
      MosMed's fitted-template AUC is lower than LIDC's, with correspondingly
      higher prior-normalised skill -- prior dominance tracks the positional
      stereotypy of the finding.
    falsifier: ordering reverses or is indistinguishable.
  - id: H10
    role: secondary
    statement: >-
      Per seed, the paired per-bag difference between the mask-fitted separable
      template and the trained arm on the flat axis does not favour the trained
      arm. Each seed scores as one of three outcomes and the claim survives
      unless trained-wins takes a majority.
    estimand: template_family.paired_flat_auc['masks:separable - trained']
    member: separable
    axis: flat
    # Added by amendment 2026-08-15. The statement said "the trained arm",
    # singular, and never named it -- with nine arms in the sweep that is a
    # best-of-9 selection sitting inside a hypothesis whose own
    # member_rationale refuses best-of-k for the template family. Pinned to
    # the arm every discovery number and every threshold in this document
    # came from. All learned_attention arms are scored and reported; only
    # this one carries the verdict.
    arm: 'slot:div=0.5'
    arm_set: learned_attention
    statistic: patient_clustered_bootstrap
    reps: 10000
    bootstrap_seed: 0
    outcomes:
      oracle_wins: CI entirely above 0 -- the content-free reference beats the network.
      indistinguishable: CI contains 0.
      trained_wins: CI entirely below 0 -- the network beats the reference.
    aggregation: majority over seeds
    falsifier: trained-wins is the majority outcome across seeds.
    rationale: >-
      Drafted first as a two-outcome test ("the interval contains zero for a
      majority"), which mis-scores its own evidence: on the discovery dumps the
      interval crosses zero on three and puts the oracle strictly ahead on two,
      and BOTH of those are stronger than the claim being made, not weaker. A
      two-outcome form would have recorded an oracle win as a failure. Only
      trained-wins withdraws anything.
    member_rationale: >-
      separable is pinned, not selected. All four family members are reported;
      choosing whichever of them wins on test would be the best-of-k error the
      denominator ruling already refuses.

# ---------------------------------------------------------------- blinding
blinding:
  enabled: true
  scope: model_arms
  key_path: runs/prereg/unblind_key.json
  code_prefix: ARM
  code_nibbles: 6
  note: >-
    Procedural, NOT cryptographic. Anyone with filesystem access can read the
    key. Its value is preventing casual mid-iteration peeking and creating an
    auditable unblinding event, not making cheating impossible. Claiming more
    than that would itself be an integrity problem.
