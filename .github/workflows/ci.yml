# The standing bar, run by a machine instead of by habit: the pre-registration chain first,
# then ruff, mypy and pytest.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU wheel FIRST, so the dependency list below resolves torch as already-satisfied instead
      # of pulling ~2.5 GB of CUDA onto a runner that has no GPU.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2" torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # FIRST, and deliberately before the linters: this is the claim the paper actually makes.
      # It re-derives canonical_hash from configs/prereg/isbi2027.yaml, checks it against the hash
      # recorded in PREREGISTRATION.md, walks the AMENDMENTS.md chain for gaps and unfilled
      # PENDING hashes, and places every stamped result on that chain. It exits non-zero on
      # MISMATCH, on a broken lineage, or on an UNKNOWN stamp.
      #
      # --check needs no GPU, no data and no runs/ -- the split files it verifies are committed,
      # and a runs/ directory absent on a fresh clone simply places zero stamps, which is not an
      # error. So unlike the rest of this file it tests the thing that is hardest to test by hand
      # and easiest to break by accident: editing the YAML without going through --amend.
      - name: Pre-registration chain
        run: python scripts/prereg_freeze.py --check

      - run: ruff check .

      # Scoped to the estimand core, not all of slotmil/, and the scope is the point rather than
      # a convenience. These nine modules compute every number the paper reports and enforce the
      # pre-registration chain; they are clean and must stay clean. The wider package carries 20
      # pre-existing errors, most of them torch-stub false positives (a registered buffer typed as
      # Module, so `x / self.std` reads as Tensor / Module). Widening the scope means fixing those
      # on their own merits -- it does not mean loosening this gate.
      #
      # slotmil/eval/verdict.py joined the scope with the hypothesis scorers: it decides every
      # reported PASS/FAIL/VOID, which makes it the last module in the repo that should be allowed
      # to hold an unchecked type.
      - name: Type-check the estimand core
        run: >
          mypy
          slotmil/prereg.py
          slotmil/eval/estimands.py
          slotmil/eval/axes.py
          slotmil/eval/nulls.py
          slotmil/eval/templates.py
          slotmil/eval/classification.py
          slotmil/eval/verdict.py
          slotmil/losses.py
          slotmil/data/feature_cache.py

      # A runner has no HDF5 feature caches and no checkpoints. Every test in the suite is built
      # to run without them -- 340 pass on a fresh clone with no data at all. A skip here means an
      # environment gate started firing that should not have, which is a regression, not noise.
      #
      # Bare `pytest`, not `python -m pytest`: tests/test_lung_mask_io.py imports from scripts/,
      # and pyproject's `pythonpath = ["."]` is what puts the repo root on sys.path for the bare
      # form. Without that line this step fails at COLLECTION -- 0 passed, not 1 failed.
      - run: pytest -q
